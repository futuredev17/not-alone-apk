name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      # 1. 先用官方命令降级，防止破坏 yaml 格式
      - run: flutter pub get
      - run: flutter pub add record:5.0.0

      # 2. 找回你之前的补丁文件，强行给 4.4.0 补上 namespace 和 compileSdk
      - name: Fix record namespace
        run: bash .github/fix_record_file.txt

      # 3. 直接打包
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
