name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      # 1. 强制改掉 pubspec.yaml 里的版本，锁死 4.4.0
      - run: sed -i 's/record: .*/record: 4.4.0/' pubspec.yaml
      
      # 2. 拉取依赖
      - run: flutter pub get
      
      # 3. 暴力清理可能残留的 5.1.0 脏缓存
      - run: find ~/.pub-cache -type d -path "*record_linux*" -exec rm -rf {} +
      
      # 4. 直接打包
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
