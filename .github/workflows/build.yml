name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      # 1. 正常拉取依赖
      - run: flutter pub get

      # 2. 用强大的包管理器强行覆盖降级为 4.4.0（绝不会破坏文件格式）
      - run: flutter pub add record:4.4.0

      # 3. 顺手把可能残留的 linux 坏代码删了
      - run: find ~/.pub-cache -type d -path "*record_linux*" -exec rm -rf {} +

      # 4. 直接打包
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
