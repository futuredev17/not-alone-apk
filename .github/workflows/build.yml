 name: Build Android APK

 on:
  workflow_dispatch:

 jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - run: flutter pub get
      
      # 1. 降级版本
      - run: flutter pub add record:4.4.0

      # 2. 执行强行修改源码的脚本（注意路径，我帮你改好了）
      - name: Fix record plugin
        run: chmod +x .github/fix_record_file.txt && bash .github/fix_record_file.txt

      # 3. 开始打包
      - run: flutter build apk --release

      # 4. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
