name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - run: flutter pub get
      
      - name: Force fix record plugin SDK
        run: |
          flutter pub add record:4.4.0
          find ~/.pub-cache -name "build.gradle" -path "*record*" | xargs sed -i 's/ext.flutter.compileSdkVersion/ext.flutter.compileSdkVersion ?: 35/g'
          find ~/.pub-cache -name "build.gradle" -path "*record*" | xargs sed -i 's/flutter.compileSdkVersion/flutter.compileSdkVersion ?: 35/g'

      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
