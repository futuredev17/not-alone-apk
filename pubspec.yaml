name: not_alone
description: Not alone 3.0 — a gentle companion app.
publish_to: 'none'
version: 3.0.0+30

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.1.0
  file_picker: ^8.1.6
  flutter_local_notifications: ^18.0.1
  flutter_timezone: 3.0.1
  http: ^1.2.2
  path_provider: ^2.1.5
  record: ^5.2.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  table_calendar: ^3.1.3
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/flower_field_en.png
    - assets/images/birthday_cake.png
    - assets/Ring10.wav

  # 可选：想要保证三端字体完全一致时，把字体文件放进 assets/fonts，
  # 取消下面的注释，并在 AppFont 中把 family 改成对应名字。
  #
  # fonts:
  #   - family: NotoSerifSC
  #     fonts:
  #       - asset: assets/fonts/NotoSerifSC-Regular.ttf
  #   - family: NotoSansSC
  #     fonts:
  #       - asset: assets/fonts/NotoSansSC-Regular.ttf
